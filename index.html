<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d1c"><title>Student Companion — BSEB Study Buddy</title>
<style>
:root{color-scheme:dark;--bg:#080d1c;--panel:rgba(19,28,53,.78);--line:rgba(148,163,184,.18);--text:#eef4ff;--muted:#9aabc8;--cyan:#53e3f4;--violet:#9c8bff;--green:#55e6ad}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#17224a 0,transparent 42%),radial-gradient(ellipse at 95% 18%,#132d42 0,transparent 32%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:12px;background:#1b2946;color:var(--text);padding:10px 14px;transition:.18s}button:hover{border-color:var(--cyan);transform:translateY(-1px)}button.primary{background:linear-gradient(100deg,#635bdb,#168da9);border:0}input,select,textarea{width:100%;background:#0d162b;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;margin:5px 0 10px}label{color:var(--muted);font-size:13px}.shell{max-width:1120px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#6d5ee9,#26c8df);display:grid;place-items:center;font-size:23px;box-shadow:0 0 32px #5b6fe344}.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:225px minmax(0,1fr);gap:18px}.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;backdrop-filter:blur(16px);box-shadow:0 12px 35px #0002}.nav{display:flex;flex-direction:column;gap:7px;align-self:start;position:sticky;top:12px}.nav button{text-align:left;background:transparent}.nav button.active{background:linear-gradient(100deg,#635bdb44,#28d2e922);border-color:#7c8df2}.content{min-width:0}.hero{padding:24px;background:linear-gradient(120deg,#685de833,#24c7d522);border-color:#8294ff44;margin-bottom:16px}.hero h2{font-size:clamp(23px,4vw,34px);margin:5px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat strong{display:block;font-size:25px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row>*{flex:1}.task,.question,.flash{border:1px solid var(--line);border-radius:13px;padding:12px;margin:9px 0;background:#101a31}.task.done{opacity:.65}.task.done .taskname{text-decoration:line-through}.small{font-size:12px;color:var(--muted)}.progress{height:7px;background:#293652;border-radius:9px;overflow:hidden;margin:9px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));width:0}.hidden{display:none!important}.pill{display:inline-block;border:1px solid var(--line);padding:4px 9px;border-radius:20px;color:var(--cyan);font-size:12px}.drop{border:1px dashed #637aa6;border-radius:15px;padding:18px;text-align:center;background:#0e1830}.choices{display:grid;gap:8px;margin:12px 0}.choices button{text-align:left}.choices button.correct{border-color:var(--green);background:#1b493d}.choices button.wrong{border-color:#ff8585;background:#482b38}.footer{text-align:center;color:var(--muted);font-size:12px;padding:25px}.notice{border-left:3px solid var(--cyan);padding:10px 12px;background:#122239;border-radius:8px;color:#c8d7ee;font-size:13px}.card label{display:block}h1,h2,h3,p{margin-top:0}h3{margin-bottom:10px} @media(max-width:720px){.shell{padding:12px}.layout{grid-template-columns:1fr}.nav{position:static;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.nav button{text-align:center;padding:9px 5px;font-size:12px}.grid{grid-template-columns:1fr}.stats{gap:7px}.stat{padding:12px}.stat strong{font-size:20px}.panel,.card{padding:14px}.hero{padding:18px}}
</style>
</head>
<body><div class="shell">
<header class="top"><div class="brand"><div class="logo">✦</div><div><strong>Student Companion</strong><div class="small">BSEB Bihar Board · Class 10–12</div></div></div><div class="row" style="flex:0 1 280px"><select id="classSelect" aria-label="Class"><option value="10">Class 10</option><option value="11">Class 11</option><option value="12">Class 12</option></select><select id="lang" aria-label="Language"><option>English</option><option>Hindi</option><option>Hinglish</option></select></div></header>
<div class="layout"><nav class="panel nav" id="nav"><button class="active" data-page="home">⌂ Dashboard</button><button data-page="planner">▦ Study Planner</button><button data-page="quiz">◈ PDF Quiz</button><button data-page="cards">▤ Flashcards</button><button data-page="progress">↗ Progress</button><button data-page="settings">⚙ Settings</button></nav><main class="content" id="view"></main></div><footer class="footer">Made for students · Your study data stays in this browser</footer></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const KEY='student-companion-v1';
let state=load(),page='home',quiz={items:[],index:0,answers:[],active:false},draftCards=[];
function load(){try{return Object.assign({profile:{grade:'10',language:'English'},tasks:[],cards:[],attempts:[]},JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return {profile:{grade:'10',language:'English'},tasks:[],cards:[],attempts:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function id(){return Math.random().toString(36).slice(2,10)}
function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateAdd(date,n){let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function pretty(d){return new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}
function tasksFor(date){return state.tasks.filter(t=>t.date===date)}
function doneCount(){return state.tasks.filter(t=>t.done).length}
function progressBar(n){return '<div class="progress"><span style="width:'+Math.max(0,Math.min(100,n))+'%"></span></div>'}
function field(label,id,type='text',value='',extra=''){return '<label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+type+'" value="'+esc(value)+'" '+extra+'>'}
function selectField(label,id,options,value){return '<label for="'+id+'">'+label+'</label><select id="'+id+'">'+options.map(o=>'<option '+(o[0]===value?'selected':'')+' value="'+esc(o[0])+'">'+esc(o[1])+'</option>').join('')+'</select>'}
function render(){ $('#classSelect').value=state.profile.grade;$('#lang').value=state.profile.language;$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let views={home,planner,quizPage,cardsPage,progressPage,settingsPage};$('#view').innerHTML=views[({home:'home',planner:'planner',quiz:'quizPage',cards:'cardsPage',progress:'progressPage',settings:'settingsPage'})[page]]();bind()}
function home(){let dt=today(),ts=tasksFor(dt),done=ts.filter(t=>t.done).length;return '<section class="card hero"><span class="pill">YOUR PERSONAL STUDY SPACE</span><h2>Study smarter, one day at a time.</h2><p class="muted">Small consistent sessions. Better revision. Real progress.</p><button class="primary" data-go="planner">Plan my study day →</button></section><div class="stats"><div class="card stat"><span class="muted">Tasks completed</span><strong>'+doneCount()+'</strong><span class="small">of '+state.tasks.length+' total</span></div><div class="card stat"><span class="muted">Quiz attempts</span><strong>'+state.attempts.length+'</strong><span class="small">practice sessions</span></div><div class="card stat"><span class="muted">Saved cards</span><strong>'+state.cards.length+'</strong><span class="small">for revision</span></div></div><section class="card"><div class="section-title"><h3>Today · '+pretty(dt)+'</h3><button data-go="planner">Manage plan</button></div>'+progressBar(ts.length?done/ts.length*100:0)+(ts.length?ts.map(taskHTML).join(''):'<p class="muted">No tasks planned for today yet. Create your first study task.</p>')+'</section><div class="grid" style="margin-top:14px"><section class="card"><h3>Quiz from a chapter PDF</h3><p class="muted">Turn selectable PDF text into a practice quiz.</p><button data-go="quiz">Create quiz</button></section><section class="card"><h3>Revise with flashcards</h3><p class="muted">Make cards from a chapter and save only what you need.</p><button data-go="cards">Make flashcards</button></section></div>'}
function taskHTML(t){return '<div class="task '+(t.done?'done':'')+'"><div class="row"><div><strong class="taskname">'+esc(t.title)+'</strong><div class="small">'+esc(t.subject)+' · '+esc(t.duration)+' min · '+esc(t.date)+'</div></div><button data-task="'+t.id+'" data-action="toggle">'+(t.done?'Undo':'✓ Done')+'</button><button data-task="'+t.id+'" data-action="delete">×</button></div></div>'}
function planner(){let period=state.period||'today',start=state.start||today(),days=Number(state.days||7),end=dateAdd(start,days-1),list=state.tasks.filter(t=>t.date>=start&&t.date<=end),complete=list.filter(t=>t.done).length;return '<section class="card hero"><span class="pill">STUDY PLANNER</span><h2>Build a plan that fits your life.</h2><p class="muted">Choose a date range, add manageable sessions, and track your progress.</p></section><section class="card"><div class="grid">'+selectField('Plan period','period',[['today','Today'],['week','1 Week'],['10','10 Days'],['14','2 Weeks'],['month','1 Month'],['custom','Custom dates']],period)+field('Start date','start','date',start)+field('Number of days (1–60)','days','number',days,'min="1" max="60"')+field('Available study hours per day','hours','number',state.hours||3,'min="0.5" max="16" step="0.5")+'</div><button class="primary" id="generatePlan">Generate suggested plan</button><div class="notice" style="margin-top:12px">Suggested plans are editable. This planner uses your selected subjects and time, not a paid AI service.</div></section><section class="card" style="margin-top:14px"><div class="section-title"><h3>'+pretty(start)+' — '+pretty(end)+'</h3><span class="pill">'+complete+'/'+list.length+' complete</span></div>'+progressBar(list.length?complete/list.length*100:0)+Array.from({length:Math.min(days,60)},(_,i)=>{let d=dateAdd(start,i),a=tasksFor(d).filter(t=>t.date>=start&&t.date<=end);return '<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div class="section-title"><strong>'+pretty(d)+'</strong><button data-adddate="'+d+'">+ Add task</button></div>'+(a.length?a.map(taskHTML).join(''):'<p class="small">No tasks yet.</p>')+'</div>'}).join('')+'</section>'}
function quizPage(){return '<section class="card hero"><span class="pill">PDF → PRACTICE</span><h2>Quiz yourself on any chapter.</h2><p class="muted">Select a text-based PDF, choose how many questions you want, and practise.</p></section><section class="card"><div class="drop"><div style="font-size:30px">⇧</div><strong>Choose chapter PDF</strong><p class="small">PDF only · processed in your browser · text-based PDFs supported</p><input id="quizPdf" type="file" accept="application/pdf"></div><div class="grid" style="margin-top:12px">'+selectField('Question count','qcount',[[5,'5 questions'],[10,'10 questions'],[15,'15 questions'],[20,'20 questions'],[30,'30 questions']],10)+selectField('Question language','qlang',[['English','English'],['Hindi','Hindi'],['Hinglish','Hinglish']],state.profile.language)+'</div><button class="primary" id="makeQuiz">Extract text & create quiz</button><div id="quizStatus" class="notice" style="margin-top:12px">Your PDF stays on this device. This first version uses local text extraction and creates practice questions from extractable content; it does not claim questions are official BSEB questions.</div></section><section class="card" id="quizBox" style="margin-top:14px">'+(quiz.active?quizRender():'<h3>Your quiz appears here</h3><p class="muted">For useful questions, use a chapter PDF with selectable text and clear definitions, facts, or concepts.</p>')+'</section>'}
function quizRender(){if(quiz.index>=quiz.items.length){let score=quiz.items.filter((q,i)=>quiz.answers[i]===q.answer).length;return '<span class="pill">QUIZ COMPLETE</span><h2>Your score: '+score+'/'+quiz.items.length+'</h2>'+progressBar(score/quiz.items.length*100)+'<p class="muted">Review your answers below.</p>'+quiz.items.map((q,i)=>'<div class="question"><strong>Q'+(i+1)+'. '+esc(q.q)+'</strong><p class="'+(quiz.answers[i]===q.answer?'':'muted')+'">Your answer: '+esc(q.options[quiz.answers[i]]||'Not answered')+'</p><p>Correct: '+esc(q.options[q.answer])+'</p><p class="small">'+esc(q.explain)+'</p></div>').join('')+'<button class="primary" id="restartQuiz">Try again</button>'}let q=quiz.items[quiz.index];return '<div class="section-title"><span class="pill">QUESTION '+(quiz.index+1)+' / '+quiz.items.length+'</span><span class="small">'+quiz.items.filter((x,i)=>quiz.answers[i]!==undefined).length+' answered</span></div>'+progressBar(quiz.index/quiz.items.length*100)+'<h3>'+esc(q.q)+'</h3><div class="choices">'+q.options.map((o,i)=>'<button data-answer="'+i+'" class="'+(quiz.answers[quiz.index]===i?(i===q.answer?'correct':'wrong'):'')+'">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join('')+'</div>'+(quiz.answers[quiz.index]!==undefined?'<div class="notice"><strong>'+ (quiz.answers[quiz.index]===q.answer?'Correct!':'Not quite.')+'</strong><br>'+esc(q.explain)+'</div>':'')+'<div class="section-title" style="margin-top:14px"><button id="prevQ" '+(quiz.index===0?'disabled':'')+'>← Previous</button><button class="primary" id="nextQ">'+(quiz.index===quiz.items.length-1?'Finish quiz':'Next →')+'</button></div>'}
function cardsPage(){return '<section class="card hero"><span class="pill">ACTIVE RECALL</span><h2>Turn a chapter into revision cards.</h2><p class="muted">Create draft cards from your PDF, select the ones worth keeping, and revisit them later.</p></section><section class="card"><div class="drop"><strong>Choose chapter PDF</strong><p class="small">PDF text is extracted locally; scanned image-only PDFs need OCR.</p><input id="cardsPdf" type="file" accept="application/pdf"></div><div class="grid">'+selectField('Card language','clang',[['English','English'],['Hindi','Hindi'],['Hinglish','Hinglish']],state.profile.language)+selectField('Maximum draft cards','ccount',[[5,'5 cards'],[10,'10 cards'],[15,'15 cards'],[20,'20 cards']],10)+'</div><button class="primary" id="makeCards">Generate draft cards</button><div id="cardsStatus" class="notice" style="margin-top:12px">Review each generated card before saving. Generated cards may need corrections.</div></section><section class="card" style="margin-top:14px"><div class="section-title"><h3>Draft cards</h3><div class="row"><button id="selectAll">Select all</button><button class="primary" id="saveCards">Save selected</button></div></div><div id="drafts">'+(draftCards.length?draftCards.map(draftHTML).join(''):'<p class="muted">Your generated cards will appear here.</p>')+'</div></section><section class="card" style="margin-top:14px"><h3>Saved flashcards ('+state.cards.length+')</h3>'+(state.cards.length?state.cards.map((c,i)=>'<details class="flash"><summary>'+esc(c.front)+'</summary><p>'+esc(c.back)+'</p><button data-carddel="'+c.id+'">Remove</button></details>').join(''):'<p class="muted">Save cards you want to revise later.</p>')+'</section>'}
function draftHTML(c){return '<div class="flash"><label><input type="checkbox" data-draft="'+c.id+'" '+(c.selected?'checked':'')+' style="width:auto"> Save this card</label><strong>'+esc(c.front)+'</strong><p class="muted">'+esc(c.back)+'</p></div>'}
function progressPage(){let total=state.attempts.length,avg=total?Math.round(state.attempts.reduce((s,a)=>s+a.score/a.total,0)/total*100):0;return '<section class="card hero"><h2>Your progress, at a glance.</h2><p class="muted">Your saved study data lives in this browser.</p></section><div class="stats"><div class="card stat"><span class="muted">Tasks completed</span><strong>'+doneCount()+'</strong></div><div class="card stat"><span class="muted">Quiz attempts</span><strong>'+total+'</strong></div><div class="card stat"><span class="muted">Average quiz score</span><strong>'+avg+'%</strong></div></div><section class="card"><h3>Recent quiz attempts</h3>'+(total?state.attempts.slice(-10).reverse().map(a=>'<div class="task"><strong>'+esc(a.title)+'</strong><p class="small">'+esc(a.date)+' · '+a.score+'/'+a.total+'</p></div>').join(''):'<p class="muted">Complete a quiz to see your results here.</p>')+'</section>'}
function settingsPage(){return '<section class="card hero"><h2>Personalize your study space.</h2><p class="muted">Choose your class and study preferences.</p></section><section class="card">'+selectField('Class','setGrade',[['10','Class 10'],['11','Class 11'],['12','Class 12']],state.profile.grade)+selectField('Board','setBoard',[['BSEB','BSEB Bihar Board']],state.profile.board||'BSEB')+selectField('Stream (Class 11–12)','stream',[['Science','Science'],['Arts','Arts'],['Commerce','Commerce'],['Other','Other']],state.profile.stream||'Science')+'<button class="primary" id="saveSettings">Save settings</button><hr style="border-color:var(--line);margin:18px 0"><h3>Local data</h3><p class="muted">Reset removes study tasks, saved cards and quiz history from this browser.</p><button id="resetData">Reset all local data</button></section>'}
function bind(){$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));$('#classSelect').onchange=e=>{state.profile.grade=e.target.value;save();render()};$('#lang').onchange=e=>{state.profile.language=e.target.value;save()};$$('[data-task]').forEach(b=>b.onclick=()=>{let t=state.tasks.find(t=>t.id===b.dataset.task);if(!t)return;if(b.dataset.action==='toggle')t.done=!t.done;else state.tasks=state.tasks.filter(x=>x.id!==t.id);save();render()});$$('[data-adddate]').forEach(b=>b.onclick=()=>addTask(b.dataset.adddate));if($('#generatePlan'))$('#generatePlan').onclick=generatePlan;if($('#period'))$('#period').onchange=e=>{state.period=e.target.value;let d={today:1,week:7,'10':10,'14':14,month:30};if(d[e.target.value])$('#days').value=d[e.target.value];$('#days').disabled=e.target.value!=='custom';if(e.target.value==='today')$('#start').value=today()};if($('#makeQuiz'))$('#makeQuiz').onclick=makeQuiz;if($('#makeCards'))$('#makeCards').onclick=makeCards;if($('#saveCards'))$('#saveCards').onclick=saveCards;if($('#selectAll'))$('#selectAll').onclick=()=>{draftCards.forEach(c=>c.selected=true);render()};$$('[data-draft]').forEach(c=>c.onchange=()=>{let d=draftCards.find(d=>d.id===c.dataset.draft);if(d)d.selected=c.checked});$$('[data-carddel]').forEach(b=>b.onclick=()=>{state.cards=state.cards.filter(c=>c.id!==b.dataset.carddel);save();render()});if($('#saveSettings'))$('#saveSettings').onclick=()=>{state.profile.grade=$('#setGrade').value;state.profile.board=$('#setBoard').value;state.profile.stream=$('#stream').value;save();render()};if($('#resetData'))$('#resetData').onclick=()=>{if(confirm('Delete all saved tasks, flashcards and quiz history from this browser?')){state={profile:state.profile,tasks:[],cards:[],attempts:[]};save();render()}};if($('#prevQ'))$('#prevQ').onclick=()=>{quiz.index=Math.max(0,quiz.index-1);render()};if($('#nextQ'))$('#nextQ').onclick=()=>{if(quiz.index<quiz.items.length-1)quiz.index++;else{let score=quiz.items.filter((q,i)=>quiz.answers[i]===q.answer).length;state.attempts.push({title:quiz.title||'PDF Quiz',date:today(),score,total:quiz.items.length});save()}render()};$$('[data-answer]').forEach(b=>b.onclick=()=>{quiz.answers[quiz.index]=Number(b.dataset.answer);render()});if($('#restartQuiz'))$('#restartQuiz').onclick=()=>{quiz.index=0;quiz.answers=[];render()}}
function go(p){page=p;render()}
function addTask(date){let title=prompt('What will you study?');if(!title)return;let subject=prompt('Subject (e.g. Maths, Science, English)','Science')||'General';let duration=Number(prompt('Duration in minutes','45'))||45;state.tasks.push({id:id(),title:title.slice(0,120),subject,duration:Math.max(5,Math.min(360,duration)),date,done:false});save();render()}
function generatePlan(){let period=$('#period').value,start=$('#start').value||today(),days=Number($('#days').value)||7,hours=Number($('#hours').value)||3;let preset={today:1,week:7,'10':10,'14':14,month:30};if(period!=='custom')days=preset[period];days=Math.max(1,Math.min(60,days));state.period=period;state.start=start;state.days=days;state.hours=hours;let subjects=state.profile.grade==='10'?['Maths','Science','Social Science','Hindi','English']:state.profile.stream==='Arts'?['History','Geography','Political Science','Hindi','English']:state.profile.stream==='Commerce'?['Accountancy','Business Studies','Economics','Hindi','English']:['Physics','Chemistry','Maths','English'];let mins=Math.round(hours*60),per=Math.max(15,Math.floor(mins/3));for(let i=0;i<days;i++){let d=dateAdd(start,i);if(!state.tasks.some(t=>t.date===d&&!t.done&&t.generated)){subjects.slice(0,Math.min(3,subjects.length)).forEach((s,j)=>state.tasks.push({id:id(),title:(j===2?'Revise & practise: ':'Study: ')+s,subject:s,duration:per,date:d,done:false,generated:true}))}}save();render()}
async function getPdfText(file,statusId){let status=$('#'+statusId);if(!file)throw Error('Choose a PDF first.');if(file.type!=='application/pdf'&&!file.name.toLowerCase().endsWith('.pdf'))throw Error('Please select a PDF file.');if(file.size>15*1024*1024)throw Error('PDF must be 15 MB or smaller.');status.textContent='Loading PDF text extractor…';if(!window.pdfjsLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}status.textContent='Reading PDF pages…';let doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let chunks=[];for(let i=1;i<=Math.min(doc.numPages,100);i++){status.textContent='Extracting text from page '+i+' of '+doc.numPages+'…';let p=await doc.getPage(i),c=await p.getTextContent();let txt=c.items.map(x=>x.str).join(' ').replace(/\s+/g,' ').trim();if(txt)chunks.push(txt)}let text=chunks.join('\n');if(text.length<120)throw Error('Very little selectable text found. Scanned/image-only PDFs need OCR; try a text-based PDF.');return text.slice(0,180000)}
function loadScript(src){return new Promise((res,rej)=>{let s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(Error('Could not load PDF text extractor. Check internet connection and retry.'));document.head.appendChild(s)})}
function sentences(text){return text.replace(/\s+/g,' ').split(/(?<=[.!?।])\s+|(?<=:)\s+/).map(s=>s.trim()).filter(s=>s.length>45&&s.length<420)}
function makeOptions(answer,context){let words=[...new Set(context.match(/[A-Za-z][A-Za-z-]{4,}/g)||[])].filter(w=>w.toLowerCase()!==answer.toLowerCase());let opts=[answer];for(let w of words){if(opts.length===4)break;if(!opts.some(x=>x.toLowerCase()===w.toLowerCase()))opts.push(w)}while(opts.length<4)opts.push('None of these');return opts.sort(()=>Math.random()-.5)}
async function makeQuiz(){let status=$('#quizStatus');try{let text=await getPdfText($('#quizPdf').files[0],'quizStatus'),lines=sentences(text),count=Number($('#qcount').value);if(lines.length<3)throw Error('Not enough clear sentences to create a reliable quiz. Try a longer chapter PDF.');let chosen=[];for(let i=0;i<Math.min(count,lines.length);i++)chosen.push(lines[Math.floor(i*lines.length/Math.min(count,lines.length))]);quiz.items=chosen.map((s,i)=>{let words=s.match(/[A-Za-z][A-Za-z-]{4,}/g)||[],answer=words.sort((a,b)=>b.length-a.length)[0]||'chapter concept';let masked=s.replace(new RegExp(answer.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'),'________');return {q:'According to the chapter, complete the statement: '+masked,options:makeOptions(answer,text),answer:0,explain:'Source sentence: '+s}});quiz.items.forEach(q=>{q.answer=q.options.findIndex(o=>q.explain.toLowerCase().includes(o.toLowerCase())&&o!=='None of these');if(q.answer<0)q.answer=0});quiz.index=0;quiz.answers=[];quiz.active=true;quiz.title=$('#quizPdf').files[0].name;status.textContent='Created '+quiz.items.length+' practice questions from extracted text. These are automatically generated practice questions, not official BSEB questions.';render();$('#quizStatus').textContent=status.textContent}catch(e){status.textContent=e.message||'Could not create quiz.'}}
async function makeCards(){let status=$('#cardsStatus');try{let text=await getPdfText($('#cardsPdf').files[0],'cardsStatus'),lines=sentences(text),count=Number($('#ccount').value);if(lines.length<2)throw Error('Not enough clear text found to create flashcards.');draftCards=[];let selected=[];for(let i=0;i<Math.min(count,lines.length);i++)selected.push(lines[Math.floor(i*lines.length/Math.min(count,lines.length))]);draftCards=selected.map(s=>({id:id(),front:'What is the key point? '+(s.length>105?s.slice(0,102)+'…':s),back:s,selected:false}));status.textContent='Generated '+draftCards.length+' draft cards. Review and select the cards you want to save.';render();$('#cardsStatus').textContent=status.textContent}catch(e){status.textContent=e.message||'Could not create cards.'}}
function saveCards(){let picked=draftCards.filter(c=>c.selected);if(!picked.length){alert('Select at least one card to save.');return}for(let c of picked){if(!state.cards.some(x=>x.front===c.front&&x.back===c.back))state.cards.push({id:id(),front:c.front,back:c.back})}save();draftCards=draftCards.filter(c=>!c.selected);render()}
$('#nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)};render();
</script></body></html>
